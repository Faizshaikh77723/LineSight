name: Deploy FSOC WebGL to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify WebGL files
        run: |
          echo "Checking WebGL loader..."
          echo "File size:"
          wc -c FSOC_web/Build/Webgl.loader.js
          echo ""
          echo "First 3 lines:"
          head -n 3 FSOC_web/Build/Webgl.loader.js
          echo ""
          echo "Checking for Git LFS pointer..."
          if grep -q "version https://git-lfs.github.com/spec/v1" FSOC_web/Build/Webgl.loader.js; then
            echo "ERROR: Webgl.loader.js is still an LFS pointer!"
            exit 1
          else
            echo "OK: Webgl.loader.js is a real JavaScript file."
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload FSOC WebGL site
        uses: actions/upload-pages-artifact@v4
        with:
          path: './FSOC_web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
